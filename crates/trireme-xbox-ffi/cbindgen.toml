# cbindgen config for the Xbox C ABI header.
#   cargo install cbindgen
#   cbindgen --config cbindgen.toml --crate trireme-xbox-ffi --output trireme_xbox.h
# Then add trireme_xbox.h + trireme_xbox.lib to the C++/WinRT project.
language = "C"
include_guard = "TRIREME_XBOX_H"
autogen_warning = "/* Generated by cbindgen. Do not edit; regenerate from crates/trireme-xbox-ffi. */"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"

[export]
prefix = ""

[parse]
parse_deps = false

[fn]
must_use = "TRIREME_MUST_USE"
