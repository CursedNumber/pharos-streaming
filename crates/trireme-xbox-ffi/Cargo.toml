[package]
name = "trireme-xbox-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C-ABI shim exposing the Trireme client core to a C++/WinRT UWP shell on Xbox (Series X|S, Dev Mode)."

# Why a hand-written C ABI instead of UniFFI:
# UniFFI has no first-class C++/WinRT generator, and the Xbox shell only needs a
# handful of entry points, so a stable `extern "C"` boundary (header generated by
# cbindgen) is more robust on the tier-3 `x86_64-uwp-windows-msvc` target than
# fighting a community C++ bindgen. This crate is the Xbox analogue of the iOS
# staticlib: the shell owns decode/present/audio/input; the core owns transport,
# pairing, and the wire protocol.
[lib]
# staticlib → `trireme_xbox.lib`, linked directly into the C++/WinRT MSIX app
#             (the iOS/XCFramework pattern, no separate .dll to package).
# lib       → so workspace tests and cbindgen can link the crate.
name = "trireme_xbox"
crate-type = ["staticlib", "lib"]

[dependencies]
# The shim is a pure adapter: it implements core-ffi's FrameSink/AudioSink
# callback traits over C function pointers and delegates to the existing
# start_video_stream / client_pair. transport, core-crypto, and core-proto come
# in transitively through core-ffi.
#
# PLAN B (see README): if `uniffi`/`core-ffi` refuse to build for the UWP target
# under build-std, drop this dependency and depend on `transport` + `core-crypto`
# + `core-proto` + `tokio` directly, reimplementing the ~200-line stream glue here.
core-ffi = { path = "../core-ffi" }
