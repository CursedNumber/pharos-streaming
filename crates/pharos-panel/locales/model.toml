# --- Resolution policy ----------------------------------------------------
["respol.native"]
en = "Native per display"
nb = "Naturlig per skjerm"

["respol.native_desc"]
en = "Every virtual display streams at its own native resolution — best fidelity."
nb = "Hver virtuelle skjerm strømmer i sin egen naturlige oppløsning — best kvalitet."

["respol.uniform"]
en = "Uniform (LCD wall)"
nb = "Ensartet (LCD-vegg)"

["respol.uniform_desc"]
