# --- fields ---------------------------------------------------------------
["apps.field.name"]
en = "Name"
nb = "Navn"

["apps.field.slug"]
en = "Slug"
nb = "Slug"

["apps.field.slug_hint"]
en = "auto from name"
nb = "auto fra navn"

["apps.field.slug_desc"]
en = "Short id used by the CLI (`launch-app <slug>`) and the client relay. Left blank, it's derived from the name."
nb = "Kort id brukt av CLI (`launch-app <slug>`) og klientreléet. Hvis tom, avledes den fra navnet."

["apps.field.kind"]
en = "Kind"
nb = "Type"

["apps.field.gyro"]
en = "Gyro"
nb = "Gyro"

["apps.field.gyro_desc"]
en = "How the host treats controller gyro while this app is the active foreground app. Defaults to Enabled (raw to the game). Requires the client to also opt in to gyro relay in Trireme settings — otherwise no gyro reaches the host."
nb = "Hvordan verten håndterer gyro når dette programmet er aktivt. Standard er Aktivert (rå til spillet). Krever også at klienten slår på gyro-overføring i Trireme-innstillingene — ellers når ingen gyro frem til verten."

["apps.gyro.enabled"]
en = "Enabled — raw to game"
nb = "Aktivert — rå til spillet"

["apps.gyro.mouse"]
en = "Mouse — gyro→mouse aim"
nb = "Mus — gyro→mussikte"

["apps.gyro.disabled"]
en = "Disabled — ignored"
nb = "Av — ignorert"

["apps.field.fps_cap"]
en = "FPS cap"
nb = "FPS-tak"

["apps.field.fps_cap_desc"]
en = "Cap this app's framerate with a MangoHud limiter on launch. The stream's output is a fixed refresh, so rendering above it just wastes GPU and heat. Auto matches the virtual output's rate; Fixed sets an explicit number. Direct-launched apps only — a Steam game must set its cap in its Steam launch options (e.g. mangohud %command%)."
nb = "Begrens programmets bildefrekvens med en MangoHud-begrenser ved oppstart. Strømmens utgang har fast oppdateringsfrekvens, så å tegne over den sløser bare GPU og varme. Auto følger den virtuelle utgangens frekvens; Fast setter et eksplisitt tall. Kun for direktestartede programmer — et Steam-spill må sette taket i sine Steam-oppstartsvalg (f.eks. mangohud %command%)."

["apps.fps_cap.off"]
en = "Off — uncapped"
nb = "Av — uten tak"

["apps.fps_cap.auto"]
en = "Auto — match the output"
nb = "Auto — følg utgangen"

["apps.fps_cap.fixed"]
en = "Fixed…"
nb = "Fast…"

["apps.field.perf_overlay"]
en = "Perf overlay"
nb = "Ytelsesoverlegg"

["apps.field.perf_overlay_on"]
en = "Show MangoHud overlay"
nb = "Vis MangoHud-overlegg"

["apps.field.perf_overlay_desc"]
en = "Burn MangoHud's perf overlay (fps, frametime, GPU/CPU) into this app's stream so you can read it on the client. Off by default — the FPS cap normally runs MangoHud invisibly. Direct-launched apps only; a Steam game must add 'mangohud %command%' to its Steam launch options."
nb = "Brenn MangoHuds ytelsesoverlegg (fps, bildetid, GPU/CPU) inn i programmets strøm så du kan lese det på klienten. Av som standard — FPS-taket kjører normalt MangoHud usynlig. Kun for direktestartede programmer; et Steam-spill må legge til «mangohud %command%» i sine Steam-oppstartsvalg."

["apps.field.mangohud_absent"]
en = "MangoHud not detected on the host — install it to enable the overlay and FPS cap."
nb = "MangoHud ikke funnet på verten — installer det for å aktivere overlegg og FPS-tak."

["apps.field.perf_overlay_on_rtss"]
en = "Show RTSS overlay"
nb = "Vis RTSS-overlegg"

["apps.field.perf_overlay_desc_rtss"]
en = "Start RivaTuner Statistics Server with this app so its on-screen display (fps, frametime) is burned into the stream. RTSS hooks apps system-wide, so this also works for Steam games; what the OSD shows is configured in RTSS itself."
nb = "Start RivaTuner Statistics Server sammen med dette programmet slik at skjermvisningen (fps, bildetid) brennes inn i strømmen. RTSS hekter seg på programmer systemvidt, så dette virker også for Steam-spill; hva OSD-en viser konfigureres i RTSS selv."

["apps.field.rtss_absent"]
en = "RTSS (RivaTuner Statistics Server) not detected — install it to enable the overlay."
nb = "RTSS (RivaTuner Statistics Server) ikke funnet — installer det for å aktivere overlegget."

["apps.field.command"]
en = "Launch command"
nb = "Startkommando"

["apps.field.command_desc"]
en = "The command to run. Tokenized on spaces (quotes respected) unless “Run in shell” is on."
nb = "Kommandoen som kjøres. Deles på mellomrom (anførselstegn respekteres) med mindre «Kjør i skall» er på."

["apps.field.shell"]
en = "Run in shell"
nb = "Kjør i skall"

["apps.field.shell_desc"]
en = "Run the command through /bin/sh -c (cmd /C on Windows) so pipes, && and URI handlers work."
nb = "Kjør kommandoen via /bin/sh -c (cmd /C på Windows) slik at rør, && og URI-håndterere virker."

