# Apps tab (the application launcher). rust-i18n v2: one key per section, each
# carrying per-locale values. English is default + fallback.
_version = 2

["apps.heading"]
en = "Applications"
nb = "Programmer"

["apps.intro"]
en = "Apps you save here appear on the host's virtual display and as box-art tiles on Trireme clients. Launch them here, from a Trireme tile, or with `pharos-compositor launch-app <slug>`."
nb = "Programmer du lagrer her vises på vertens virtuelle skjerm og som omslagsfliser på Trireme-klienter. Start dem her, fra en Trireme-flis, eller med `pharos-compositor launch-app <slug>`."

["apps.toolbar.add"]
en = "Add application"
nb = "Legg til program"

["apps.toolbar.add_desc"]
en = "Open the editor to create a new application — start from a Steam scan, an installed app, or any executable."
nb = "Åpne editoren for å lage et nytt program — start fra et Steam-søk, et installert program, eller en hvilken som helst kjørbar fil."

["apps.live_on"]
en = "Host connected — launches go live"
nb = "Vert tilkoblet — start kjører direkte"

["apps.live_off"]
en = "Host offline — edits are saved; launches need a running host."
nb = "Vert frakoblet — endringer lagres; start krever en kjørende vert."

["apps.empty"]
en = "No applications yet. Click “Add application” to create one."
nb = "Ingen programmer ennå. Klikk «Legg til program» for å lage ett."

