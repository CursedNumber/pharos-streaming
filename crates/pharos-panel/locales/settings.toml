["settings.desktop.enable_virtual_displays_desc"]
en = "On (default): apps stream to their own isolated virtual display, as configured per app. Off: nothing gets an isolated virtual display — every stream, including the built-in Desktop tile, mirrors your REAL desktop instead, with full keyboard/mouse control of it."
nb = "På (standard): apper strømmes til sin egen isolerte virtuelle skjerm, slik det er satt opp per app. Av: ingen får en isolert virtuell skjerm — all strømming, inkludert den innebygde Skrivebord-flisen, speiler i stedet ditt VIRKELIGE skrivebord, med full tastatur-/musekontroll over det."

