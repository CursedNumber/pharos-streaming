nb = "PHAROS_QUEUE_FRAMES — kødybde for enkoder."

["settings.streaming.queue_desc"]
en = "How many frames the encoder may buffer. Lower = lower latency but more prone to stutter under load; 8 is a sane balance."
nb = "Hvor mange bilder enkoderen kan bufre. Lavere = lavere ventetid, men mer utsatt for hakking under belastning; 8 er en fornuftig balanse."

