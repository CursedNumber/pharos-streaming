["settings.streaming.bitrate_desc"]
en = "Higher = sharper but more bandwidth + risk of backlog on slow links. 20000 (20 Mbit/s) is a good 1080p120 default."
nb = "Høyere = skarpere, men mer båndbredde + risiko for opphopning på trege forbindelser. 20000 (20 Mbit/s) er en god standard for 1080p120."

["settings.streaming.window"]
en = "QUIC window"
nb = "QUIC-vindu"

["settings.streaming.window_label_desc"]
en = "PHAROS_STREAM_WINDOW_KB — the latency-critical knob."
nb = "PHAROS_STREAM_WINDOW_KB — den ventetidskritiske innstillingen."

["settings.streaming.window_desc"]
en = "QUIC flow-control window. Too large buffers ~seconds of video and adds lag; keep it small (256 KiB) for interactive use. This was the original ~2 s bottleneck."
nb = "QUIC flytkontrollvindu. For stort bufrer ~sekunder med video og gir forsinkelse; hold det lite (256 KiB) for interaktiv bruk. Dette var den opprinnelige flaskehalsen på ~2 s."

["settings.streaming.queue"]
