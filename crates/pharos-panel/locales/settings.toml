# rust-i18n locale file (v2) for the Settings tab.
# English is the default + fallback. Every user-facing string in
# crates/pharos-panel/src/tabs/settings.rs is keyed here under the "settings.*"
# namespace so keys never clash with another tab's strings. To add a language,
# add its code (e.g. `"fr"`) alongside `en` under each key.
#
# Two keys this tab also reads — `settings.appearance.language` and
# `settings.appearance.language_desc` — live in app.toml (owned there) and are
# intentionally NOT redefined here to avoid duplicate-key collisions.
#
# Purely dynamic values (numbers, MAC addresses, file paths, the pairing
# command) stay as Rust formatting — only the static labels and descriptions
# around them live here.
_version = 2

