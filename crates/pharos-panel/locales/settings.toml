nb = "ANBEFALT"

["settings.resolution.why_title"]
en = "Why these defaults"
nb = "Hvorfor disse standardene"

["settings.resolution.why_body"]
en = "• Native per display keeps every screen crisp at its own resolution — best for a heterogeneous mix (4K monitor + 1080p TV).\n• Lowest-common refresh shares one pacer across displays, so frames are emitted in lock-step and you get no cross-display tearing — the compositor only runs a single fps clock anyway."
nb = "• Native per skjerm holder hver skjerm skarp i sin egen oppløsning — best for en blandet sammensetning (4K-skjerm + 1080p TV).\n• Laveste felles oppdateringsfrekvens deler én pacer på tvers av skjermene, slik at bilder sendes i takt og du får ingen riving mellom skjermer — Compositor kjører uansett bare én fps-klokke."

# --- Streaming / encoding ---------------------------------------------------
