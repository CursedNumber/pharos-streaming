nb = "Det sammensatte virtuelle skrivebordet, tegnet i målestokk. Dra en klient fra paletten hit for å legge til en skjerm; dra en flis for å flytte den; klikk på en flis for å velge den; Shift- eller Ctrl/Cmd-klikk for flervalg; klikk på tomt område for å tømme valget."

["compositor.canvas.legend_desc"]
