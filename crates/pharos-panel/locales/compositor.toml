# rust-i18n locale file (v2) for the Compositor tab. English is the default +
# fallback. Every key is namespaced `compositor.*` so it never clashes with
# another tab's locale file. To add a language, add its code alongside `en`.
_version = 2

# --- Heading / intro -------------------------------------------------------
["compositor.heading"]
en = "Compositor"
nb = "Compositor"

["compositor.policy.title"]
en = "Display policy (resolution + refresh)"
nb = "Visningspolicy (oppløsning + oppdatering)"

["compositor.badge.experimental"]
en = "multi-CLIENT · experimental"
nb = "multi-CLIENT · eksperimentell"

# --- Mirror mode (one shared encode for all clients) -----------------------
["compositor.mirror.label"]
en = "Mirror to all clients"
nb = "Speil til alle klienter"

["compositor.mirror.desc"]
en = "Share ONE encode across every connected client instead of streaming to one at a time. Saves GPU/encode work, but the stream is clamped to the weakest client's resolution, frame rate, and bitrate — so quality is throttled to the lowest common denominator. A single client keeps full per-client adaptation."
nb = "Del ÉN koding mellom alle tilkoblede klienter i stedet for å strømme til én om gangen. Sparer GPU/koding, men strømmen begrenses til den svakeste klientens oppløsning, bildefrekvens og bitrate."

["compositor.mirror.throttle_title"]
en = "Mirror — quality limited"
nb = "Speil — kvalitet begrenset"

["compositor.mirror.armed"]
en = "Mirror on — clamps to the weakest client once a second device connects"
nb = "Speil på — begrenses til den svakeste klienten når en ny enhet kobler til"

["compositor.mirror.encoding"]
en = "Shared encode"
nb = "Delt koding"

["compositor.mirror.capped_by"]
en = "capped by"
nb = "begrenset av"

["compositor.mirror.pending"]
en = "Shared encode is live. Per-client quality adaptation (which client is the limit) isn't wired yet, and multi-client streaming is pending a 2-device test."
nb = "Delt koding er aktiv. Tilpasning per klient er ikke koblet ennå, og flerklient-strømming venter på en to-enheters test."

["compositor.intro"]
en = "Lay out a composite virtual desktop across several Trireme clients. Drag a client from the palette onto the canvas to create a display."
nb = "Legg ut et sammensatt virtuelt skrivebord over flere Trireme-klienter. Dra en klient fra paletten over på lerretet for å opprette en skjerm."

# --- Toolbar ---------------------------------------------------------------
["compositor.toolbar.arrange_hint"]
en = "Drag a device from the palette onto the canvas, then drag tiles to arrange — they snap to each other's edges."
nb = "Dra en enhet fra paletten ut på lerretet, og dra deretter brikkene for å ordne dem — de fester seg til hverandres kanter."

["compositor.toolbar.arrange_hint_desc"]
en = "How to build a layout: each paired device in the palette is a drag source; drop it on the canvas to add a display, then drag displays around — they snap flush to neighbouring edges like Windows display settings."
nb = "Slik bygger du et oppsett: hver paret enhet i paletten er en drakilde; slipp den på lerretet for å legge til en skjerm, og dra deretter skjermene rundt — de fester seg kant-i-kant med naboene, som Windows skjerminnstillinger."

["compositor.toolbar.fps"]
en = "Shared FPS"
nb = "Delt fps"

["compositor.toolbar.fps_desc"]
en = "One shared pacer drives every output — the compositor runs a single frame-rate across the whole virtual desktop. Raising this lifts every display at once."
nb = "Én delt pacer driver alle utganger — Compositor kjører én felles bildefrekvens over hele det virtuelle skrivebordet. Å heve denne løfter alle skjermer på én gang."

["compositor.toolbar.policy"]
en = "Resolution policy:"
nb = "Oppløsningspolicy:"

["compositor.toolbar.policy_set_in_settings"]
en = "(set in Settings)"
nb = "(angitt i Innstillinger)"

["compositor.toolbar.policy_desc_suffix"]
en = "Change this on the Settings tab; new tiles size and snap to match."
nb = "Endre dette i Innstillinger-fanen; nye fliser dimensjoneres og festes deretter."

["compositor.toolbar.policy_badge_desc"]
en = "The active resolution policy, chosen on the Settings tab. It governs how freshly-dropped displays are sized and how they snap together."
nb = "Den aktive oppløsningspolicyen, valgt i Innstillinger-fanen. Den styrer hvordan nyslupne skjermer dimensjoneres og hvordan de festes sammen."

["compositor.toolbar.maximize"]
en = "Maximize canvas"
nb = "Maksimer lerret"

["compositor.toolbar.restore"]
en = "Restore palette"
nb = "Gjenopprett palett"

["compositor.toolbar.maximize_desc"]
en = "Give the canvas the full width by folding the palette into a compact top strip. Toggle again to restore the side-by-side palette."
nb = "Gi lerretet full bredde ved å folde paletten inn i en kompakt topplinje. Veksle igjen for å gjenopprette paletten ved siden av."

["compositor.toolbar.equalize"]
en = "Equalize to smallest"
nb = "Utjevn til minste"

["compositor.toolbar.equalize_desc"]
en = "Uniform (LCD wall) policy: clamp every display to the resolution of the smallest tile, so the wall is uniform."
nb = "Uniform (LCD-vegg) policy: lås alle skjermer til oppløsningen til den minste flisen, slik at veggen blir enhetlig."

