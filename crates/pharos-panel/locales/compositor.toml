# --- Footnote --------------------------------------------------------------
["compositor.footnote.heading"]
en = "About this layout"
nb = "Om dette oppsettet"

["compositor.footnote.what"]
en = "“Apply / Save layout” writes the compositor's multi.toml (one [[output]] block per display, plus the shared fps). The Pharos host reads this file to drive multiple Trireme clients as one composite virtual desktop."
nb = "«Bruk / Lagre oppsett» skriver Compositor sin multi.toml (én [[output]]-blokk per skjerm, pluss den delte fps-en). Pharos-verten leser denne filen for å drive flere Trireme-klienter som ett sammensatt virtuelt skrivebord."

["compositor.footnote.status"]
en = "Status: multi-HOST (several monitors on one Pharos box) is validated. multi-CLIENT (this — fanning one desktop across several Triremes) is new and experimental; expect rough edges."
nb = "Status: multi-HOST (flere skjermer på én Pharos-maskin) er validert. multi-CLIENT (dette — å spre ett skrivebord over flere Triremer) er nytt og eksperimentelt; forvent ujevnheter."

["compositor.footnote.tip"]
en = "Tip: drag clients from the palette to add displays, drag tiles to reposition them, Shift/Ctrl-click to multi-select, and use the Arrange tools for one-click align, distribute, snap and duplicate. The resolution policy (Settings) controls how new tiles size and snap."
nb = "Tips: dra klienter fra paletten for å legge til skjermer, dra fliser for å flytte dem, Shift/Ctrl-klikk for flervalg, og bruk Ordne-verktøyene for justering, fordeling, festing og duplisering med ett klikk. Oppløsningspolicyen (Innstillinger) styrer hvordan nye fliser dimensjoneres og festes."

