# --- Layout-mode presets (Mirror / Extend / Single) ------------------------
["compositor.modes.heading"]
en = "Layout mode"
nb = "Oppsettsmodus"

["compositor.modes.hint"]
en = "One-click arrangements. Each rewrites every display below, then save with Apply to take effect on the host's next start."
nb = "Oppsett med ett klikk. Hvert valg skriver om alle skjermene nedenfor; lagre med Bruk for at det skal tre i kraft ved vertens neste oppstart."

["compositor.modes.mirror"]
en = "Mirror"
nb = "Speil"

["compositor.modes.mirror_desc"]
en = "Mirror / duplicate: put every display at the same size and position (top-left), so they all stream the same desktop. The shared size is the largest existing display, or 1920×1080 if they're mixed or empty."
nb = "Speil / dupliser: sett hver skjerm til samme størrelse og posisjon (øverst til venstre), slik at de alle strømmer det samme skrivebordet. Den felles størrelsen er den største eksisterende skjermen, eller 1920×1080 hvis de er blandede eller tomme."

["compositor.modes.extend"]
en = "Extend"
nb = "Utvid"

["compositor.modes.extend_desc"]
en = "Extend: lay the displays out left-to-right, each flush against the previous one's right edge and top-aligned, forming one wide virtual desktop with distinct regions. Each display keeps its own size."
nb = "Utvid: legg skjermene fra venstre til høyre, hver kant i kant med den forrige sin høyrekant og toppjustert, slik at de danner ett bredt virtuelt skrivebord med atskilte områder. Hver skjerm beholder sin egen størrelse."

["compositor.modes.single"]
en = "Single"
nb = "Enkel"

["compositor.modes.single_desc"]
en = "Single: keep just one display — the selected one if any, otherwise the first — at the origin and drop the rest. If the layout is empty, add a fresh 1920×1080 display."
nb = "Enkel: behold bare én skjerm — den valgte hvis noen, ellers den første — i origo og fjern resten. Hvis oppsettet er tomt, legg til en ny 1920×1080-skjerm."

["compositor.modes.note"]
en = "Modes are file-driven: the host applies a saved layout on its next (re)start."
nb = "Modusene er fildrevne: verten tar i bruk et lagret oppsett ved sin neste (om)start."

["compositor.modes.note_desc"]
en = "By the lean-CLI design there is no live \"switch mode now\" command — a mode rewrites the layout, you Apply to save it to multi.toml, and the compositor picks it up the next time it starts."
nb = "Etter det enkle CLI-designet finnes det ingen «bytt modus nå»-kommando i sanntid — en modus skriver om oppsettet, du trykker Bruk for å lagre det til multi.toml, og kompositoren tar det i bruk neste gang den starter."

# --- Media Player ---------------------------------------------------------
["compositor.media.heading"]
en = "Media Player"
nb = "Mediespiller"

["compositor.media.heading_desc"]
en = "Play a video file into the running compositor; it composes onto the displays and streams to every connected Trireme over the existing QUIC sink. Live only — this needs the host's control socket, so a compositor must be running."
nb = "Spill av en videofil inn i den kjørende kompositoren; den settes sammen på skjermene og strømmes til hver tilkoblet Trireme over den eksisterende QUIC-sluken. Kun sanntid — dette krever vertens kontrollsocket, så en kompositor må kjøre."

["compositor.media.path_hint"]
