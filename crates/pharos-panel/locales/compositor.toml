["compositor.media.path_desc"]
en = "Absolute path on the host to the media file to play. Type the path — there is no file picker (the host may be a different machine than this panel)."
nb = "Absolutt sti på verten til mediefilen som skal spilles av. Skriv inn stien — det finnes ingen filvelger (verten kan være en annen maskin enn dette panelet)."

["compositor.media.play"]
en = "Play"
nb = "Spill av"

["compositor.media.play_desc"]
en = "Tell the running compositor to play this file fullscreen on the host output. It streams to every connected Trireme over the live QUIC sink. Disabled until a path is set and a host is connected."
nb = "Be den kjørende kompositoren spille av denne filen i fullskjerm på vertsutgangen. Den strømmes til hver tilkoblet Trireme over den aktive QUIC-sluken. Deaktivert til en sti er satt og en vert er tilkoblet."

["compositor.media.play_need_path"]
en = "Enter the path to a media file on the host first."
nb = "Skriv inn stien til en mediefil på verten først."

["compositor.media.stop"]
en = "Stop"
nb = "Stopp"

["compositor.media.stop_desc"]
en = "Stop whatever media the compositor is currently playing. Disabled when no host is connected."
nb = "Stopp uansett hvilke medier kompositoren spiller av nå. Deaktivert når ingen vert er tilkoblet."

["compositor.media.status_play_prefix"]
