nb = "Ingen kontrollerprofiler ennå"

["controllers.empty.body"]
en = "The host saves a profile the first time a pad connects, or you can add one by hand with “Add controller”."
nb = "Verten lagrer en profil første gang en kontroller kobles til, eller du kan legge til en manuelt med «Legg til kontroller»."

["controllers.empty.desc"]
en = "There are no saved controller profiles. A profile is created automatically the first time a pad connects to the host, or you can pre-register one with Add controller."
nb = "Det finnes ingen lagrede kontrollerprofiler. En profil opprettes automatisk første gang en kontroller kobles til verten, eller du kan forhåndsregistrere en med Legg til kontroller."

