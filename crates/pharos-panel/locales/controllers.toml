# rust-i18n locale file (v2) — Controllers tab.
# This file is owned exclusively by the Controllers tab; keys are namespaced
# "controllers.*" so they never collide with other tabs. English is the default
# and the fallback. To add a language, add its code (e.g. `"fr"`) alongside `en`
# under each key.
_version = 2

# --- page header ------------------------------------------------------------
["controllers.heading"]
en = "Game Controllers"
nb = "Spillkontrollere"

["controllers.intro_desc"]
en = "Per-controller feel the host applies the moment a pad connects — face-button swaps and gyro→mouse tuning, keyed by USB VID:PID. These are the persisted host profiles; live edits during a stream relay the same values over the input channel."
nb = "Følelse per kontroller som verten bruker i det øyeblikket en kontroller kobles til — bytte av ansiktsknapper og gyro→mus-justering, nøklet på USB VID:PID. Dette er de lagrede vertprofilene; redigeringer i sanntid under en strøm videresender de samme verdiene over inndatakanalen."

# --- toolbar ----------------------------------------------------------------
["controllers.toolbar.add"]
en = "Add controller"
nb = "Legg til kontroller"

["controllers.toolbar.add_desc"]
en = "Register a controller by USB VID:PID without it being plugged in, so its profile is ready the moment the pad first connects."
nb = "Registrer en kontroller med USB VID:PID uten at den er koblet til, slik at profilen er klar i det øyeblikket kontrolleren kobles til første gang."

["controllers.toolbar.save"]
en = "Save profiles"
nb = "Lagre profiler"

["controllers.toolbar.save_desc"]
en = "Write controller-profiles.toml, the file the host reads. Saved profiles are applied automatically whenever a matching pad connects."
nb = "Skriv controller-profiles.toml, filen verten leser. Lagrede profiler brukes automatisk når en kontroller som passer kobles til."

["controllers.toolbar.unsaved"]
en = "● unsaved"
nb = "● ikke lagret"

["controllers.toolbar.saved_status"]
en = "Saved controller profiles."
nb = "Lagret kontrollerprofiler."

["controllers.toolbar.save_error"]
en = "save controller profiles:"
nb = "lagre kontrollerprofiler:"

# --- sections ---------------------------------------------------------------
["controllers.section.configured"]
en = "Configured controllers"
nb = "Konfigurerte kontrollere"

["controllers.section.configured_desc"]
en = "The controllers the host has a saved profile for, keyed by USB VID:PID. Each card edits that pad's face-button swaps and gyro tuning; changes apply the next time the pad connects."
nb = "Kontrollerne verten har en lagret profil for, nøklet på USB VID:PID. Hvert kort redigerer den kontrollerens bytte av ansiktsknapper og gyro-justering; endringer trer i kraft neste gang kontrolleren kobles til."

["controllers.section.presets"]
en = "Presets"
nb = "Forhåndsinnstillinger"

["controllers.section.presets_intro"]
en = "Named, reusable feels you can apply to any controller (mirrors the TV \"Manage\" flow). Apply copies a preset onto a controller's profile; you still need to Save to persist."
nb = "Navngitte, gjenbrukbare følelser du kan bruke på hvilken som helst kontroller (gjenspeiler TV-ens \"Administrer\"-flyt). Bruk kopierer en forhåndsinnstilling til en kontrollers profil; du må fortsatt lagre for å beholde den."

["controllers.section.usbip"]
en = "USB/IP forwarding classes"
nb = "USB/IP-videresendingsklasser"

