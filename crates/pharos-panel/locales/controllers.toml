# --- USB/IP reference -------------------------------------------------------
["controllers.usbip.intro_desc"]
en = "Reference, not settings. Explains the three USB/IP transport classes a controller can use to reach the host, since the carriage method — not the pad — is what limits gyro and audio."
nb = "Referanse, ikke innstillinger. Forklarer de tre USB/IP-transportklassene en kontroller kan bruke for å nå verten, siden bæremetoden — ikke kontrolleren — er det som begrenser gyro og lyd."

["controllers.usbip.relay_badge"]
en = "relay"
nb = "relé"

["controllers.usbip.relay_title"]
en = "USB/IP relay (HID — wired pads)"
nb = "USB/IP-relé (HID — kablede kontrollere)"

["controllers.usbip.relay_body"]
en = "Interrupt/bulk HID controllers export cleanly over USB/IP: the client exports the local device, the host imports it into a virtual hub. Gyro + paddles come through as-is. Best path for a wired DualSense/DS4."
nb = "Interrupt/bulk-HID-kontrollere eksporteres rent over USB/IP: klienten eksporterer den lokale enheten, verten importerer den til en virtuell hub. Gyro + padler kommer gjennom som de er. Beste vei for en kablet DualSense/DS4."

["controllers.usbip.bt_badge"]
en = "pair-and-forward"
nb = "par-og-videresend"

["controllers.usbip.bt_title"]
en = "Bluetooth (pair locally, then forward)"
nb = "Bluetooth (par lokalt, videresend deretter)"

["controllers.usbip.bt_body"]
en = "BT bonding can’t ride USB/IP (the radio’s link keys never cross the wire). Pair the pad to the client device’s own Bluetooth first; its HID stream then forwards normally. This is the route for wireless Switch Pro / 8BitDo."
nb = "BT-binding kan ikke gå over USB/IP (radioens koblingsnøkler krysser aldri kabelen). Par kontrolleren med klientenhetens egen Bluetooth først; HID-strømmen videresendes deretter normalt. Dette er veien for trådløs Switch Pro / 8BitDo."

["controllers.usbip.iso_badge"]
en = "unsupported"
nb = "støttes ikke"

["controllers.usbip.iso_title"]
en = "Isochronous (USB audio / webcams) — deferred"
nb = "Isokron (USB audio / webkameraer) — utsatt"

["controllers.usbip.iso_body"]
en = "Isochronous endpoints (controller headset audio, camera) are architected for but gated off post-v1 — rusb has no iso API and Android can’t service it. Controller *input* never uses iso, so pads are unaffected."
nb = "Isokrone endepunkter (lyd fra kontrollerheadset, kamera) er det lagt opp til, men de er stengt av etter v1 — rusb har ingen iso API og Android kan ikke betjene det. Kontroller-*inndata* bruker aldri iso, så kontrollere påvirkes ikke."

