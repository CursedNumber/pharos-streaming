# Cross-link to the host-wide A/B swap fallback (lives in Settings → Gamepad).
["controllers.global_fallback_link"]
en = "Host-wide A/B swap fallback → Settings › Gamepad"
nb = "Vertsomfattende A/B-byttereserve → Innstillinger › Spillkontroller"

["controllers.global_fallback_desc"]
en = "A single host-wide A/B-swap fallback applies to any pad that has no per-controller override here. It lives in Settings → Gamepad (collapsed by default); click to open that tab. Per-controller swaps above always win over it."
nb = "En enkelt vertsomfattende A/B-byttereserve gjelder for enhver kontroller som ikke har en egen overstyring her. Den ligger i Innstillinger → Spillkontroller (sammenslått som standard); klikk for å åpne den fanen. Bytter per kontroller ovenfor vinner alltid over den."

# --- gyro editor ------------------------------------------------------------
["controllers.gyro.heading"]
en = "Gyro → mouse"
nb = "Gyro → mus"

["controllers.gyro.enabled"]
en = "enabled"
nb = "aktivert"

["controllers.gyro.enabled_desc"]
en = "Master switch for gyro aiming on this controller. When off, the pad's motion sensor is ignored and the knobs below have no effect."
nb = "Hovedbryter for gyro-sikting på denne kontrolleren. Når den er av, ignoreres kontrollerens bevegelsessensor og innstillingene under har ingen effekt."

["controllers.gyro.reset"]
en = "Reset to defaults"
nb = "Tilbakestill til standard"

["controllers.gyro.reset_desc"]
en = "Restore the shipped gyro feel for this controller (sensitivity, acceleration, axis mapping, and inversion all return to the factory values)."
nb = "Gjenopprett den medfølgende gyrofølelsen for denne kontrolleren (følsomhet, akselerasjon, aksekobling og invertering går alle tilbake til fabrikkverdiene)."

["controllers.gyro.no_sensor_hint"]
en = "This controller family has no gyro hint — tuning still saves, but gyro→mouse only works if the pad actually exposes a sensor."
nb = "Denne kontrollerfamilien har ikke noe gyro-hint — justeringen lagres likevel, men gyro→mus virker bare hvis kontrolleren faktisk har en sensor."

["controllers.gyro.no_sensor_desc"]
en = "The host has no record that this controller family carries a motion sensor. The tuning is still saved and relayed, but it only does anything if the physical pad really exposes gyro data."
nb = "Verten har ingen registrering av at denne kontrollerfamilien har en bevegelsessensor. Justeringen lagres og videresendes likevel, men den gjør bare noe hvis den fysiske kontrolleren faktisk eksponerer gyro-data."

["controllers.gyro.curve_desc"]
en = "Acceleration curve preview: vertical is the output gain applied to your base sensitivity (1× at the bottom), horizontal is how fast you rotate the pad in degrees per second. The vertical line marks the accel knee (accel_ref); the horizontal line marks the clamp ceiling (1 + accel max). It mirrors exactly what the host applies."
nb = "Forhåndsvisning av akselerasjonskurven: loddrett er utgangsforsterkningen som brukes på grunnfølsomheten din (1× nederst), vannrett er hvor raskt du roterer kontrolleren i grader per sekund. Den loddrette linjen markerer akselerasjonsknekket (accel_ref); den vannrette linjen markerer begrensningstaket (1 + maks akselerasjon). Den gjenspeiler nøyaktig det verten bruker."

# --- sliders ----------------------------------------------------------------
["controllers.slider.sens_x"]
en = "Sensitivity X"
nb = "Følsomhet X"

["controllers.slider.sens_x_help"]
en = "Horizontal gyro sensitivity, in screen pixels of mouse motion per degree of controller rotation. Higher turns faster."
nb = "Horisontal gyro-følsomhet, i skjermpiksler musbevegelse per grad kontrollerrotasjon. Høyere snur raskere."

["controllers.slider.sens_y"]
en = "Sensitivity Y"
nb = "Følsomhet Y"

["controllers.slider.sens_y_help"]
en = "Vertical gyro sensitivity, in screen pixels of mouse motion per degree of controller rotation. Higher looks up/down faster."
nb = "Vertikal gyro-følsomhet, i skjermpiksler musbevegelse per grad kontrollerrotasjon. Høyere ser opp/ned raskere."

["controllers.slider.accel"]
en = "Acceleration"
nb = "Akselerasjon"

["controllers.slider.accel_help"]
en = "Extra gain applied as you rotate faster. 0 keeps a flat 1:1 feel; higher lets quick flicks travel further than the raw sensitivity alone."
nb = "Ekstra forsterkning som brukes når du roterer raskere. 0 gir en flat 1:1-følelse; høyere lar raske bevegelser nå lenger enn den rene følsomheten alene."

["controllers.slider.accel_pow"]
en = "Accel curve (pow)"
nb = "Akselerasjonskurve (pow)"

["controllers.slider.accel_pow_help"]
en = "Attack exponent of the acceleration curve. Above 1 keeps slow, precise aim near 1:1 while still ramping up fast flicks."
nb = "Eksponent for akselerasjonskurvens stigning. Over 1 holder langsom, presis sikting nær 1:1 mens raske bevegelser fortsatt trappes opp."

["controllers.slider.accel_ref"]
en = "Accel knee (deg/s)"
nb = "Akselerasjonsknekk (grader/s)"

["controllers.slider.accel_ref_help"]
en = "The rotation speed, in degrees per second, at which the acceleration curve reaches full effect (1×). Below this the curve is gentler."
nb = "Rotasjonshastigheten, i grader per sekund, der akselerasjonskurven når full effekt (1×). Under dette er kurven mildere."

["controllers.slider.accel_max"]
en = "Accel max (clamp)"
nb = "Maks akselerasjon (begrensning)"

["controllers.slider.accel_max_help"]
en = "Ceiling on the extra acceleration gain, so a sudden flick can't multiply your aim into an uncontrollable spin."
nb = "Tak på den ekstra akselerasjonsforsterkningen, slik at en plutselig bevegelse ikke kan gange siktingen din opp til en ukontrollerbar snurr."

["controllers.slider.default_label"]
en = "default:"
nb = "standard:"

