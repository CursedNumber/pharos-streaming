# --- face-button swaps ------------------------------------------------------
["controllers.swap.ab"]
en = "Swap A ↔ B"
nb = "Bytt A ↔ B"

["controllers.swap.ab_desc"]
en = "Inject B when A is pressed and vice versa — maps a Nintendo-physical layout onto Xbox button prompts."
nb = "Send B når A trykkes og omvendt — kobler et fysisk Nintendo-oppsett til Xbox-knappeanvisninger."

["controllers.swap.xy"]
en = "Swap X ↔ Y"
nb = "Bytt X ↔ Y"

["controllers.swap.xy_desc"]
