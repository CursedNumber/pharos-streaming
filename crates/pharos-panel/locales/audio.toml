# Audio tab (stub). English default + fallback.
_version = 2

["audio.heading"]
en = "Audio"
nb = "Lyd"

["audio.intro"]
en = "Host audio capture and streaming."
nb = "Lydfangst og strømming på verten."

["audio.intro_desc"]
en = "Settings for the host's audio path — the desktop/loopback audio it captures and streams to clients. Not configurable from the panel yet; this tab outlines what's coming."
nb = "Innstillinger for vertens lydbane — skrivebords-/loopback-lyden den fanger og strømmer til klienter. Kan ikke konfigureres fra panelet ennå; denne fanen skisserer hva som kommer."

["audio.status_heading"]
en = "Audio path"
nb = "Lydbane"

["audio.coming_soon"]
en = "Coming soon — not configurable yet"
nb = "Kommer snart — kan ikke konfigureres ennå"

["audio.current_path"]
en = "Today the host captures system audio and streams it as Opus over QUIC datagrams, alongside video; there are no panel controls for it yet."
nb = "I dag fanger verten systemlyden og strømmer den som Opus over QUIC-datagrammer, sammen med video; det finnes ingen panelkontroller for det ennå."

["audio.current_path_desc"]
en = "The Opus audio path (48 kHz stereo, low-latency) is wired in the host and runs automatically during a stream. This tab will surface its controls once they're exposed to the config."
nb = "Opus-lydbanen (48 kHz stereo, lav latens) er koblet inn i verten og kjører automatisk under en strøm. Denne fanen vil vise kontrollene når de blir tilgjengelige i konfigurasjonen."

["audio.see_video"]
en = "See the live Opus codec status on the Video tab →"
nb = "Se sanntidsstatus for Opus-kodeken på Video-fanen →"

["audio.see_video_desc"]
en = "The encode → transport → decode pipeline (including the live Opus audio codec and its performance rank) is shown on the Video tab. Click to open it."
nb = "Pipelinen enkode → transport → dekode (inkludert den aktive Opus-lydkodeken og dens ytelsesrangering) vises på Video-fanen. Klikk for å åpne den."

["audio.planned_heading"]
en = "Planned controls"
nb = "Planlagte kontroller"

