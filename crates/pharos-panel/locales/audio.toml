en = "What this tab is expected to expose in a future revision."
nb = "Hva denne fanen forventes å tilby i en fremtidig revisjon."

["audio.plan.device"]
en = "Capture device / source"
nb = "Fangstenhet / kilde"

["audio.plan.device_desc"]
en = "Pick which output (sink monitor / loopback) the host captures — useful when multiple audio devices are present."
nb = "Velg hvilken utgang (sink monitor / loopback) verten fanger — nyttig når flere lydenheter er til stede."

