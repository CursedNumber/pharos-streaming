# rust-i18n locale file (v2) for the Overview tab.
# English is the default + fallback. Every user-facing string in
# crates/pharos-panel/src/tabs/overview.rs is keyed here under the "overview.*"
# namespace so keys never clash with other tabs. To add a language, add its code
# (e.g. `"fr"`) alongside `en` under each key.
_version = 2

# --- Page header ----------------------------------------------------------
["overview.heading"]
en = "Overview"
nb = "Oversikt"

["overview.subtitle_desc"]
en = "The Status tab shows this host's identity and the fleet of Trireme clients it has paired with. The panel reads peers.toml — the known fleet — not a live transport, so liveness and telemetry are honestly marked Unknown until live data exists."
nb = "Oversikten viser denne vertens identitet og flåten av Trireme-klienter den er paret med. Panelet leser peers.toml — den kjente flåten — ikke en levende transport, så tilstand og telemetri er ærlig merket Ukjent inntil det finnes sanntidsdata."

