["input.event.heading"]
en = "What the link forwards (reference)"
nb = "Hva forbindelsen videresender (referanse)"

["input.event.intro"]
en = "Informational only — the message kinds the link carries, not settings. Hover any row for the full detail."
nb = "Kun til informasjon — meldingstypene forbindelsen bærer, ikke innstillinger. Hold pekeren over en rad for full detalj."

["input.event.intro_desc"]
en = "A read-only reference of the core_proto::InputEvent message kinds carried over the QUIC back-channel. These describe the wire protocol; none of them are settings you change here."
nb = "En skrivebeskyttet referanse over core_proto::InputEvent-meldingstypene som bæres over QUIC-bakkanalen. Disse beskriver wire-protokollen; ingen av dem er innstillinger du endrer her."

["input.event.wire_prefix"]
en = "Wire type:"
nb = "Wire-type:"

["input.event.keys.title"]
en = "Keyboard keys"
nb = "Tastaturtaster"

["input.event.keys.line"]
en = "Each key press and release, with modifiers."
nb = "Hvert tastetrykk og -slipp, med modifikatorer."

["input.event.keys.detail"]
en = "Carries the key's scancode (the Linux evdev code; the host adds the xkb +8 offset, and non-Linux clients translate their native code to evdev first) plus the Ctrl / Shift / Alt / Meta modifier state (Meta = Win / Super / Command)."
nb = "Bærer tastens scancode (Linux evdev-koden; verten legger til xkb +8-forskyvningen, og klienter som ikke kjører Linux oversetter sin egen kode til evdev først) pluss modifikatortilstanden Ctrl / Shift / Alt / Meta (Meta = Win / Super / Command)."

["input.event.pos.title"]
en = "Mouse position"
nb = "Museposisjon"

["input.event.pos.line"]
en = "Where the cursor is, as a fraction of the screen."
nb = "Hvor markøren er, som en brøkdel av skjermen."

["input.event.pos.detail"]
en = "Absolute pointer position normalised 0.0–1.0 across the source rectangle; the client has already removed any letterbox bars and window margins."
nb = "Absolutt pekerposisjon normalisert 0.0–1.0 over kilderektangelet; klienten har allerede fjernet eventuelle letterbox-striper og vindusmarger."

["input.event.motion.title"]
en = "Mouse movement"
nb = "Musebevegelse"

["input.event.motion.line"]
en = "Relative motion for locked-cursor aiming."
nb = "Relativ bevegelse for sikting med låst markør."

["input.event.motion.detail"]
en = "Relative pointer motion in pixels — used for pointer-locked, game-style aiming where there is no on-screen cursor to place absolutely."
nb = "Relativ pekerbevegelse i piksler — brukes til peker-låst sikting av spilltype der det ikke finnes noen markør på skjermen å plassere absolutt."

["input.event.buttons.title"]
en = "Mouse buttons"
nb = "Museknapper"

["input.event.buttons.line"]
