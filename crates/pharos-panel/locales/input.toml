# --- Injection backend (read-only) ------------------------------------------
["input.backend.heading"]
en = "Injection backend"
nb = "Injeksjons-backend"

["input.backend.active_label"]
en = "Active injector"
nb = "Aktiv injektor"

["input.backend.auto_note"]
en = "Chosen automatically by the build target — nothing to configure."
nb = "Velges automatisk av byggemålet — ingenting å konfigurere."

# Live injector-health probe (the badge colour + its description / inline note).
["input.backend.health.ready"]
en = "Probed OK: the host can inject input (/dev/uinput is writable)."
nb = "Sondert OK: verten kan injisere inndata (/dev/uinput er skrivbar)."

["input.backend.health.unknown"]
en = "Injector health isn't probed on this platform — the compile-time backend is assumed available."
nb = "Injektorhelsen sonderes ikke på denne plattformen — det kompilerte byggemålet antas tilgjengelig."

["input.backend.health.no_device"]
en = "No /dev/uinput — the uinput kernel module isn't loaded, so input can't be injected. Load it with `modprobe uinput`."
nb = "Ingen /dev/uinput — uinput-kjernemodulen er ikke lastet, så inndata kan ikke injiseres. Last den med `modprobe uinput`."

["input.backend.health.no_perm"]
en = "/dev/uinput exists but isn't writable by this user — input injection will fail. Add a udev `uaccess` rule or join the `input` group (then re-log in)."
nb = "/dev/uinput finnes, men er ikke skrivbar for denne brukeren — injisering av inndata vil mislykkes. Legg til en udev `uaccess`-regel eller bli med i `input`-gruppen (logg deretter inn på nytt)."

["input.backend.health.error"]
en = "Couldn't probe /dev/uinput (unexpected error) — input injection may not work."
nb = "Kunne ikke sondere /dev/uinput (uventet feil) — injisering av inndata fungerer kanskje ikke."

["input.backend.uinput_desc"]
en = "Forwarded events become a virtual keyboard + pointer fed into the smithay compositor seat. The host process needs access to /dev/uinput (a udev rule or membership in the `input` group)."
nb = "Videresendte hendelser blir et virtuelt tastatur + peker som mates inn i smithay-compositor-setet. Vertsprosessen trenger tilgang til /dev/uinput (en udev-regel eller medlemskap i `input`-gruppen)."

["input.backend.sendinput_desc"]
en = "Forwarded events are synthesised into the interactive desktop session via the Win32 SendInput() API. The host must run in the same session as the desktop being captured."
nb = "Videresendte hendelser syntetiseres inn i den interaktive skrivebordsøkten via Win32 SendInput()-API-et. Verten må kjøre i samme økt som skrivebordet som fanges."

["input.backend.cgevent_desc"]
en = "Forwarded events would be posted via CGEventPost; host-side support is experimental on this platform."
nb = "Videresendte hendelser ville blitt postet via CGEventPost; støtte på vertssiden er eksperimentell på denne plattformen."

["input.backend.none_desc"]
en = "No input-injection backend is available for this build target."
nb = "Ingen backend for inndatainjeksjon er tilgjengelig for dette byggemålet."

