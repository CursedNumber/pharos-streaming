# rust-i18n locale file (v2: one file per module, each key carries per-locale
# values). English is the default + fallback. To add a language, add its code
# (e.g. `"fr"`) alongside `en` under each key — it then appears automatically in
# Settings → Appearance → Language (driven by `available_locales!()`).
#
# This file is owned exclusively by the Video tab (crates/pharos-panel/src/tabs/
# video.rs). Every key is namespaced `video.*` so it never clashes with another
# tab's strings. Purely dynamic values (counts, ports, ffmpeg tokens, vendor /
# codec strings from the capability probes) stay as Rust formatting — only the
# static labels and descriptions around them live here.
_version = 2

