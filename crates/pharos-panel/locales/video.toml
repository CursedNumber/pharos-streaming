# --- Benchmark step rows -----------------------------------------------------
["video.bench.step.compose"]
en = "Compose"
nb = "Sammensetting"

["video.bench.step.compose_desc"]
en = "Time on the host composing the desktop frame (the compositor's work) before it reaches the encoder."
nb = "Tid på verten med å sette sammen skrivebordsbildet (kompositorens arbeid) før det når enkoderen."

["video.bench.step.encode"]
en = "Encode"
nb = "Enkoding"

["video.bench.step.encode_desc"]
en = "Time spent inside the encoder turning the composed frame into an HEVC bitstream."
nb = "Tid brukt inne i enkoderen med å gjøre det sammensatte bildet om til en HEVC-bitstrøm."

["video.bench.step.host_send"]
en = "Host send"
nb = "Sending fra vert"

["video.bench.step.host_send_desc"]
en = "Time on the host from the encoded frame to its bytes entering the QUIC send queue."
nb = "Tid på verten fra det enkodede bildet til bytene legges i QUIC-sendekøen."

["video.bench.step.nexus"]
en = "Network / router"
nb = "Nettverk / ruter"

["video.bench.step.nexus_desc"]
en = "The true wire/router time — the unverified-in-the-middle leg. It is RTT/2 from the clock-sync probes (not derived from any host or client stage), so it carries a ± uncertainty rather than a direct measurement."
nb = "Den faktiske tiden på ledningen/ruteren — det uverifiserte leddet i midten. Det er RTT/2 fra klokkesynk-sonderingene (ikke utledet fra noe trinn på vert eller klient), så det har en ± usikkerhet i stedet for en direkte måling."

["video.bench.step.buffer"]
en = "Buffer · in-flight"
nb = "Buffer · under transport"

["video.bench.step.buffer_desc"]
en = "In-flight residency between arrival and display — usually the dominant number, and queueing rather than compute. It pools several buffers: the decoder's internal frame/surface pool (often the biggest on loopback), the QUIC flow-control window, and the send queue. Reduce it with decoder low-delay options plus PHAROS_STREAM_WINDOW_KB / PHAROS_QUEUE_FRAMES. The GPU decode kernel (~a few ms) is folded in here — ffmpeg's output is render-paced, so its tiny decode time can't be isolated from the buffer through an external decoder."
nb = "Opphold mellom ankomst og visning — vanligvis det dominerende tallet, og kødanning snarere enn beregning. Det samler flere buffere: dekoderens interne bilde-/flatepool (ofte størst på loopback), QUIC-flytkontrollvinduet og sendekøen. Reduser det med dekoderens lavlatensvalg pluss PHAROS_STREAM_WINDOW_KB / PHAROS_QUEUE_FRAMES. GPU-dekodingen (~noen få ms) er slått sammen her — ffmpeg sin utgang taktes av visningen, så den lille dekodetiden kan ikke skilles fra bufferen via en ekstern dekoder."

["video.bench.step.present"]
en = "Present"
nb = "Visning"

["video.bench.step.present_desc"]
en = "Time on the client from the decoded picture to it being shown on screen."
nb = "Tid på klienten fra det dekodede bildet til det vises på skjermen."

["video.bench.step.total"]
en = "Total"
nb = "Totalt"

["video.bench.step.total_desc"]
en = "End-to-end latency: capture on the host through to present on the client, including the inferred network leg."
nb = "Ende-til-ende-latens: fra fangst på verten til visning på klienten, inkludert det utledede nettverksleddet."

["video.bench.nexus_caption"]
en = "Network / router is RTT/2 from the clock-sync probes — the true wire/router time, the unverified in-the-middle. Not measured directly, so treat it as approximate (± shown)."
nb = "Nettverk / ruter er RTT/2 fra klokkesynk-sonderingene — den faktiske tiden på ledningen/ruteren, det uverifiserte leddet i midten. Ikke målt direkte, så behandle den som omtrentlig (± vist)."

["video.bench.buffer_caption"]
en = "Buffer · in-flight pools the decoder's internal frame/surface pool (often the biggest on loopback), the QUIC flow-control window and the send queue — queueing, not compute, and usually the dominant number. The GPU decode kernel (~a few ms) is folded in: it can't be isolated through an external pipe-fed decoder."
nb = "Buffer · under transport samler dekoderens interne bilde-/flatepool (ofte størst på loopback), QUIC-flytkontrollvinduet og sendekøen — kødanning, ikke beregning, og vanligvis det dominerende tallet. GPU-dekodingen (~noen få ms) er slått sammen her: den kan ikke skilles via en ekstern pipe-matet dekoder."

