[package]
name = "app-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

# The Pharos application launcher — a lean, pure-Rust leaf shared by every part
# that touches "apps": the Smithay `compositor` (which actually spawns the child
# into the virtual display), `pharos-panel` (the visual Create-app editor + easy
# mode), the `launch-app` CLI verb, and the host's relay of the app catalog to
# Trireme clients.
#
# Deliberately dependency-light — NO tokio/QUIC/Smithay/image — so the
# cross-platform panel can depend on it without dragging in the host stack
# (mirrors the `host-info` / `control-ipc` "lean leaf" rule). Steam/desktop
# scanning is hand-rolled (a tolerant KeyValues reader) rather than pulling an
# external, version-fragile crate, so this builds clean on Linux, Windows, and
# ARM.
#
# The one bought-in parser is `serde_json`, for the Vulkan layer manifests
# (`vklayer.rs`). Those are real JSON written by third parties — nested objects,
# escapes, two different top-level shapes — where a hand-rolled reader would be
# the riskier choice, not the leaner one; unlike the VDF editors, which are
# hand-rolled because they must preserve Steam's bytes exactly. It is already in
# the workspace graph (control-ipc, pharos-panel) and pulls nothing new.

[dependencies]
serde = { workspace = true }
toml = "0.8"
dirs = "5"
anyhow = "1"
thiserror = { workspace = true }
tracing = "0.1"
serde_json = "1"

# Pure-Rust X11 client (no libxcb) for the tiny fullscreen WM that runs
# inside the per-app Xwayland (`xwm.rs`). Already in the workspace graph.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
