[package]
name = "integration-mqtt"
version.workspace = true
edition.workspace = true
license.workspace = true

# MQTT integration for Pharos: publishes Home Assistant MQTT-Discovery
# entities (telemetry + controls) and availability (LWT), and dispatches inbound
# command topics back to the host/client. Plain TCP (LAN broker = HA Mosquitto);
# TLS is intentionally off (default-features = false) to stay lean + cross-compile
# cleanly to windows-msvc alongside the rest of the host.

[dependencies]
anyhow = "1"
tracing = "0.1"
serde = { workspace = true }
serde_json = "1"
rumqttc = { version = "0.24", default-features = false }
# Host identity (hostname + advertised NIC MACs/IPs). Extracted into the lean
# `host-info` leaf crate and re-exported as `integration_mqtt::host` so existing
# callers keep working; it carries the cross-platform NIC enumeration we publish
# for telemetry/WoL and use for MAC-driven socket binding.
host-info = { path = "../host-info" }
