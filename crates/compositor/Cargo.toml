[package]
name = "compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pharos game-streaming host (headless Wayland compositor + NVENC)"

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transport = { path = "../transport" }
# Shared cross-platform pairing/identity glue (re-exported as `compositor::pair`).
host-core = { path = "../host-core" }
serde = { workspace = true }
# Multi-output config (capture-zc-multi).
toml = "0.8"
# Identity load for the video streamer (`Identity::load_or_create`).
core-crypto = { path = "../core-crypto" }
# Input event types arriving via the transport's input rx.
core-proto = { path = "../core-proto" }
# Local control/telemetry protocol with pharos-panel (compositor is the server).
control-ipc = { path = "../control-ipc" }
# App launcher: resolve a slug from apps.toml and spawn it into the virtual display.
app-launcher = { path = "../app-launcher" }
dirs = "5"
# PIN generation.
rand = "0.8"
hex = "0.4"
# mDNS service advertisement (zeroconf) for LAN auto-discovery.
mdns-sd = "0.20"
# gethostname(3) for the mDNS host label.
libc = "0.2"
# Async runtime for the pairing listener; tokio is already pulled in by transport.
# `sync` for the clipboard-out watch::Sender the transport hands us.
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

# Smithay + Wayland are Linux-only; the crate compiles to a stub elsewhere so
# the Windows CI job stays green.
[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "backend_gbm",
] }
# Zero-copy NVENC path (M1 #1).
nvidia-video-codec-sdk = "0.4"
cudarc = "0.16"
libloading = "0.8"
# Opus audio capture/encode (host side), streamed as QUIC datagrams.
media-audio = { path = "../media-audio" }
# uinput virtual gamepad — networked gamepad input from the Trireme client is
# injected as a real Xbox 360 pad the game reads via evdev (same crate as
# gamepad-bridge).
evdev = "0.12"
# GPU telemetry for the health watchdog (P4). dlopen's libnvidia-ml at runtime,
# so it builds without NVML present and degrades to best-effort if it's absent.
nvml-wrapper = "0.10"
# systemd sd_notify — the Type=notify/WatchdogSec external backstop for a fully
# hung render loop. No-op when not run under a notify unit (manual runs).
sd-notify = "0.4"
# Idle "no app running" screen: shared Pharos lighthouse art + glyph rasterization
# for the status text (composited once into the streamed background).
pharos-assets = { path = "../pharos-assets" }
ab_glyph = "0.2"
# Desktop-mirror capture (mirror the user's REAL desktop instead of a headless
# virtual output): xdg-desktop-portal RemoteDesktop+ScreenCast via ashpd,
# frames via PipeWire. On by default on Linux; see the `portal-mirror` feature.
ashpd = { version = "0.13.12", default-features = false, features = ["tokio", "remote_desktop", "screencast"], optional = true }
pipewire = { version = "0.10.0", optional = true }
# Pure-Rust libei/libeis client, used to inject keyboard/pointer input into
# the REAL desktop session mirrored above (the portal only hands us the fd;
# `reis` speaks the wire protocol over it). See `mirror_input.rs`.
reis = { version = "0.7", optional = true }

[[bin]]
name = "pharos-compositor"
path = "src/main.rs"

[features]
default = ["portal-mirror"]
# Desktop-mirror: mirror an existing KDE/GNOME Wayland session as an
# alternative to a headless virtual output, with full keyboard/pointer
# control back into that real session (issue #6). Needs libpipewire-0.3
# headers + clang at build time; libpipewire at runtime.
portal-mirror = ["dep:ashpd", "dep:pipewire", "dep:reis"]

# ---------------------------------------------------------------------------
# Debian packaging (issue #7). This crate doubles as the anchor for the host
# .deb: `cargo deb -p compositor --no-build` after a workspace release build
# packages ALL four host binaries (they live in sibling crates; cargo-deb only
# needs one crate to hang the metadata on, and the compositor is the heart of
# the host stack). Built by .github/workflows/release.yml on tag push.
# ---------------------------------------------------------------------------
[package.metadata.deb]
name = "pharos"
maintainer = "CursedNumber <16852735+CursedNumber@users.noreply.github.com>"
copyright = "2026 The Pharos/Trireme authors"
license-file = ["../../LICENSE", "0"]
section = "video"
priority = "optional"
extended-description = """\
Pharos is a clean-slate game-streaming host in the Sunshine/Moonlight
lineage: a headless Wayland compositor captures apps zero-copy into NVENC
(HEVC/AV1), streams over QUIC, and injects client input back as evdev/uinput
devices. This package ships the host stack: pharos-compositor (the streaming
host), pharos-panel (desktop control panel), pharos-tray (status tray icon),
and pharos-usbimport (USB/IP import bridge, optional), plus systemd units
for all three services.
.
Requires an NVIDIA GPU with the proprietary driver (libnvidia-encode /
libnvcuvid) for encoding, and a PulseAudio-compatible sound server
(PipeWire's pipewire-pulse works) for audio capture.
.
Start with: systemctl --user enable --now pharos-host pharos-tray"""
# Explicit, curated from `ldd` of the release binaries (dpkg-shlibdeps would
# pin the exact libnvidia-encode-NNN driver package, which must stay a soft
# requirement; see Recommends).
depends = "libc6 (>= 2.35), libgcc-s1, libdrm2, libexpat1, libgbm1, libopus0, libpixman-1-0, libxkbcommon0, pulseaudio-utils, libpipewire-0.3-0"
# The compositor dlopens EGL/GLES for rendering and needs the NVIDIA driver's
# encode/decode libs at load time; the panel presents via Vulkan/Wayland.
# All soft deps: package names for the NVIDIA bits vary per driver series.
recommends = "libegl1, libgles2, libvulkan1, libwayland-client0"
assets = [
    ["target/release/pharos-compositor", "usr/bin/", "755"],
    ["target/release/pharos-panel", "usr/bin/", "755"],
    ["target/release/pharos-tray", "usr/bin/", "755"],
    ["target/release/pharos-usbimport", "usr/bin/", "755"],
    ["../../packaging/systemd/pharos-host.service", "usr/lib/systemd/user/", "644"],
    ["../../packaging/systemd/pharos-tray.service", "usr/lib/systemd/user/", "644"],
    ["../../packaging/systemd/pharos-usbimport.service", "usr/lib/systemd/system/", "644"],
    ["../../packaging/desktop/pharos-panel.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/pharos.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../README.md", "usr/share/doc/pharos/", "644"],
]
