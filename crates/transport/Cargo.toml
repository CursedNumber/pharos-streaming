[package]
name = "transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
# ring-only crypto (no aws-lc-sys) so the client cross-compiles to Android.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "logging",
] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1"
# Pairing handshake messages share `core-crypto`'s types via postcard.
core-crypto = { path = "../core-crypto" }
# Input event wire type + codec.
core-proto = { path = "../core-proto" }
# USB relay exporter-hello framing (v1/v2) — parsed by `read_usb_hello`.
core-usbip = { path = "../core-usbip" }
serde = { workspace = true }
postcard = { workspace = true }
# Nonce generation for the per-connection video auth challenge.
rand = "0.8"
# Zero-copy payload type for QUIC audio datagrams.
bytes = "1"
# IDNA (ToASCII / punycode) so Unicode host names like `bücher.example` resolve.
idna = "1"
# Dual-stack UDP socket construction (IPV6_V6ONLY off) for optional IPv6 binding.
socket2 = "0.6"
