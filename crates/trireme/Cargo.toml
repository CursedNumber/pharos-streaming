[package]
name = "trireme"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trireme game-streaming client for Pharos hosts"

# The Linux reference client. Reuses the shared Rust `transport` directly (no
# JNI hop) and decodes with NVDEC. The KMP/Compose-Desktop GUI can layer on top.
[[bin]]
name = "trireme"
path = "src/main.rs"

[dependencies]
transport = { path = "../transport" }
# Input event wire types (re-exported via transport, but used directly by the
# filter/classify path in `input.rs`).
core-proto = { path = "../core-proto" }
# Cross-platform gamepad capture (issue #14): Linux evdev + Windows XInput/DInput.
gilrs = { workspace = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Multi-source player config (sources.toml, layout, per-source pace).
serde = { workspace = true }
toml = "0.8"
# Pairing handshake (shared SPAKE2 + identity).
core-crypto = { path = "../core-crypto" }
# Async runtime for the pairing client; transport pulls tokio too.
tokio = { version = "1", features = ["rt", "macros", "time"] }
hex = "0.4"
# mDNS service discovery (browser side).
mdns-sd = "0.20"
# Reverse DNS (getnameinfo) so a server added by IP can display its hostname.
dns-lookup = "3"
# Windowed player (GPU present + the PaceMode→present-mode mapping).
winit = "0.30"
wgpu = "22"
pollster = "0.3"
# Server-selector menu (the first screen).
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.29"
dirs = "5"
# USB export side (claim the device, service URBs against it via libusb).
core-usbip = { path = "../core-usbip" }
rusb = "0.9"
# Opus audio decode (from QUIC datagrams) → PCM → pacat playback.
media-audio = { path = "../media-audio" }
# HEVC HW-decoder capability probe (picks hevc_cuvid/qsv/rkmpp/v4l2 at runtime).
media-decode = { path = "../media-decode" }
# Native VNC source for split-screen cells (e.g. Proxmox VMs). RFB client; the
# decoded framebuffer is bridged to the existing NV12 render path via ffmpeg.
vnc = "0.4"
# Native SPICE source (the usual QEMU/Proxmox console protocol). Optional: it
# links libspice-client-glib-2.0 via FFI, so it's gated behind the `spice`
# feature and only pulled in (with its `ffi` feature) when that's enabled.
media-spice = { path = "../media-spice", features = ["ffi"], optional = true }

# F_SETPIPE_SZ on the decode ffmpeg's raw-frame pipes: the default 64KB pipe
# costs ~380 read syscalls per 25MB 4K P010 frame in the reader hot loop.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = []
# Compile in the native SPICE source (`protocol = "spice"`). Requires the
# spice-gtk system library at build time (pkg-config: spice-client-glib-2.0).
spice = ["dep:media-spice"]

# ---------------------------------------------------------------------------
# Debian packaging (issue #7): the client .deb. `cargo deb -p trireme
# --no-build` after a workspace release build; ships both players (the
# windowed desktop client and the headless KMS one for SBCs/TVs). Built by
# .github/workflows/release.yml on tag push.
# ---------------------------------------------------------------------------
[package.metadata.deb]
name = "trireme"
maintainer = "CursedNumber <16852735+CursedNumber@users.noreply.github.com>"
copyright = "2026 The Pharos authors"
license-file = ["../../LICENSE", "0"]
section = "video"
priority = "optional"
extended-description = """\
Trireme is the client side of Pharos, a clean-slate game-streaming stack in
the Sunshine/Moonlight lineage: video arrives as HEVC/AV1 over QUIC, decodes
through ffmpeg's hardware paths (cuvid/qsv/v4l2/rkmpp), and local input
(keyboard, mouse, gamepads, even raw USB devices over USB/IP) flows back to
the host. This package ships two players: trireme (windowed desktop client
with LAN auto-discovery and a server selector) and trireme-kms (headless
DRM/KMS player for SBCs and TVs; no desktop session needed), plus
trireme-usbexport, which shares local USB devices with the host over USB/IP.
.
Decode is delegated to the ffmpeg CLI; audio plays through a
PulseAudio-compatible server (PipeWire's pipewire-pulse works)."""
# Explicit, curated from `ldd` of the release binaries. ffmpeg is spawned as
# a subprocess for video decode; pacat (pulseaudio-utils) for audio playback.
depends = "libc6 (>= 2.35), libgcc-s1, libdrm2, libexpat1, libgbm1, libopus0, libudev1, libusb-1.0-0, ffmpeg, pulseaudio-utils"
# The desktop player dlopens Wayland/X11/Vulkan at runtime; trireme-kms
# dlopens EGL/GLES for its GBM scanout path.
recommends = "libegl1, libgles2, libvulkan1, libwayland-client0, libx11-6, libxkbcommon0"
assets = [
    ["target/release/trireme", "usr/bin/", "755"],
    ["target/release/trireme-kms", "usr/bin/", "755"],
    ["target/release/trireme-usbexport", "usr/bin/", "755"],
    ["../../packaging/desktop/trireme.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/trireme.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../README.md", "usr/share/doc/trireme/", "644"],
]
