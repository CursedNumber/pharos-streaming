[package]
name = "core-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib:    the .so/.dll the Kotlin (Android/JVM) client loads.
# staticlib: the .a linked into the iOS app via an XCFramework.
# lib:       so the uniffi-bindgen bin and tests can link the crate.
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
core-proto = { workspace = true }
core-crypto = { path = "../core-crypto" }
core-usbip = { path = "../core-usbip" }
transport = { path = "../transport" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = "1"
hex = "0.4"
thiserror = { workspace = true }
# Logging: route the shared core's `tracing` output somewhere visible. The
# transport/core crates log via `tracing`, but the Android/iOS shells load
# this as a bare cdylib with no subscriber installed, so all of it was
# silently dropped — `adb logcat` saw nothing from the Rust side (only the
# Kotlin UI thread). `init_logging()` installs a subscriber; on Android
# `paranoid-android` bridges it into logcat.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Android-only: the `tracing` → logcat bridge (only pulls `ndk-sys` on
# Android, so desktop/iOS builds are unaffected).
[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2"
